                                                        required
                                                    >
                                                    <div>
                                                        <span class="font-bold text-slate-700 block text-sm">${wh.nome}</span>
                                                        <span class="text-xs text-slate-500">${wh.descricao}</span>
                                                    </div>
                                                </label>
                                            `).join('')}
                                        </div>
                                    </div>

                                    <div class="md:col-span-2">
                                        <label class="text-sm font-bold text-slate-700 block mb-3 uppercase tracking-wide">Nome do Item *</label>
                                        <input
                                            type="text"
                                            id="itemName"
                                            value="${item.nome || ''}"
                                            class="w-full bg-white shadow-sm border-2 border-slate-200 rounded-lg p-4 focus:border-amber-500 outline-none text-base md:text-lg text-slate-800"
                                            placeholder="Ex: Capacete de Segurança"
                                            required
                                        >
                                    </div>

                                    <div>
                                        <label class="text-sm font-bold text-slate-700 block mb-3 uppercase tracking-wide">Categoria *</label>
                                        <select 
                                            id="itemCategory"
                                            class="w-full bg-white shadow-sm border-2 border-slate-200 rounded-lg p-4 focus:border-amber-500 outline-none text-base md:text-lg text-slate-800"
                                            required
                                        >
                                            <option value="">Selecione...</option>
                                            <option value="Proteção Individual" ${item.categoria === 'Proteção Individual' ? 'selected' : ''}>Proteção Individual</option>
                                            <option value="Ferramentas" ${item.categoria === 'Ferramentas' ? 'selected' : ''}>Ferramentas</option>
                                            <option value="Uniformes" ${item.categoria === 'Uniformes' ? 'selected' : ''}>Uniformes</option>
                                            <option value="Outros" ${item.categoria === 'Outros' ? 'selected' : ''}>Outros</option>
                                        </select>
                                    </div>

                                    <div>
                                        <label class="text-sm font-bold text-slate-300 block mb-3 uppercase tracking-wide">Unidade *</label>
                                        <select 
                                            id="itemUnit"
                                            class="w-full bg-slate-800/50 border-2 border-slate-700 rounded-lg p-4 focus:border-amber-500 outline-none text-base md:text-lg text-white"
                                            required
                                        >
                                            <option value="">Selecione...</option>
                                            <option value="UN" ${item.unidade === 'UN' ? 'selected' : ''}>Unidade (UN)</option>
                                            <option value="PAR" ${item.unidade === 'PAR' ? 'selected' : ''}>Par (PAR)</option>
                                            <option value="CX" ${item.unidade === 'CX' ? 'selected' : ''}>Caixa (CX)</option>
                                            <option value="KG" ${item.unidade === 'KG' ? 'selected' : ''}>Quilograma (KG)</option>
                                            <option value="LT" ${item.unidade === 'LT' ? 'selected' : ''}>Litro (LT)</option>
                                        </select>
                                    </div>

                                    <div>
                                        <label class="text-sm font-bold text-slate-700 block mb-3 uppercase tracking-wide">Unidades por Caixa</label>
                                        <input 
                                            type="number"
                                            id="itemUnitsPerBox"
                                            value="${item.unidades_por_caixa || 1}"
                                            min="1"
                                            class="w-full bg-white shadow-sm border-2 border-slate-200 rounded-lg p-4 focus:border-amber-500 outline-none text-base md:text-lg text-slate-800 font-mono"
                                        >
                                    </div>

                                    <div class="md:col-span-2">
                                        <label class="flex items-center gap-3 cursor-pointer bg-slate-50 p-4 rounded-xl border-2 border-slate-100 hover:border-amber-200 transition-all">
                                            <input 
                                                type="checkbox" 
                                                id="hasSizes" 
                                                onchange="toggleSizesSection(this.checked)"
                                                class="w-6 h-6 rounded border-slate-300 text-amber-600 focus:ring-amber-500"
                                                ${item.tamanhos && Object.keys(item.tamanhos).length > 0 ? 'checked' : ''}
                                            >
                                            <div>
                                                <span class="font-bold text-slate-700 block">Este item possui grade de tamanhos?</span>
                                                <span class="text-xs text-slate-500">Ex: Botas (38, 39, 40) ou Luvas (P, M, G)</span>
                                            </div>
                                        </label>
                                    </div>

                                    <!-- Área de Configuração de Tamanhos -->
                                    <div id="sizesConfigArea" class="md:col-span-2 ${item.tamanhos && Object.keys(item.tamanhos).length > 0 ? 'block' : 'hidden'} fade-in">
                                        <div class="bg-amber-50/50 border-2 border-amber-100 rounded-xl p-4 md:p-6">
                                            <div class="flex justify-between items-center mb-4">
                                                <h3 class="font-bold text-amber-800 flex items-center gap-2">
                                                    <i class="ph-fill ph-list-numbers"></i>
                                                    Grade de Tamanhos e Quantidades
                                                </h3>
                                                <button type="button" onclick="addSizeRow()" class="bg-amber-600 hover:bg-amber-700 text-white px-4 py-2 rounded-lg text-sm font-bold flex items-center gap-2 transition-all">
                                                    <i class="ph ph-plus"></i> Add Tamanho
                                                </button>
                                            </div>
                                            
                                            <div id="sizesList" class="space-y-2">
                                                ${item.tamanhos ? Object.entries(item.tamanhos).map(([name, qty]) => `
                                                    <div class="flex gap-3 items-center size-row mb-2">
                                                        <input type="text" class="size-name w-1/2 bg-white border border-slate-300 rounded p-2 focus:border-amber-500 outline-none" placeholder="Ex: 40 ou M" value="${name}" required>
                                                        <input type="number" class="size-qty w-1/3 bg-white border border-slate-300 rounded p-2 font-mono focus:border-amber-500 outline-none" placeholder="Qtd" value="${qty}" required min="0">
                                                        <button type="button" onclick="this.parentElement.remove()" class="text-red-500 hover:text-red-700 p-2"><i class="ph-bold ph-trash"></i></button>
                                                    </div>
                                                `).join('') : ''}
                                            </div>
                                            <p class="text-xs text-amber-600 mt-4 italic">
                                                * A quantidade total será a soma de todos os tamanhos.
                                            </p>
                                        </div>
                                    </div>

                                    <div id="singleQuantityArea" class="md:col-span-1 ${item.tamanhos && Object.keys(item.tamanhos).length > 0 ? 'hidden' : 'block'}">
                                        <label class="text-sm font-bold text-slate-700 block mb-3 uppercase tracking-wide">Quantidade em Estoque *</label>
                                        <input 
                                            type="number"
                                            id="itemQuantity"
                                            value="${item.quantidade || 0}"
                                            min="0"
                                            class="w-full bg-white shadow-sm border-2 border-slate-200 rounded-lg p-4 focus:border-amber-500 outline-none text-base md:text-lg text-slate-800 font-mono"
                                            ${item.tamanhos && Object.keys(item.tamanhos).length > 0 ? '' : 'required'}
                                        >
                                    </div>

                                    <div>
                                        <label class="text-sm font-bold text-slate-700 block mb-3 uppercase tracking-wide">CA</label>
                                        <input 
                                            type="text"
                                            id="itemCA"
                                            value="${item.ca || ''}"
                                            class="w-full bg-white shadow-sm border-2 border-slate-200 rounded-lg p-4 focus:border-amber-500 outline-none text-base md:text-lg text-slate-800 font-mono"
                                            placeholder="Ex: 12345"
                                        >
                                    </div>

                                    <div>
                                        <label class="text-sm font-bold text-slate-700 block mb-3 uppercase tracking-wide">Validade</label>
                                        <input 
                                            type="date"
                                            id="itemValidity"
                                            value="${item.validade || ''}"
                                            class="w-full bg-white shadow-sm border-2 border-slate-200 rounded-lg p-4 focus:border-amber-500 outline-none text-base md:text-lg text-slate-800"
                                        >
                                    </div>

                                    <div>
                                        <label class="text-sm font-bold text-slate-700 block mb-3 uppercase tracking-wide">Localização</label>
                                        <input 
                                            type="text"
                                            id="itemLocation"
                                            value="${item.localizacao || ''}"
                                            class="w-full bg-white shadow-sm border-2 border-slate-200 rounded-lg p-4 focus:border-amber-500 outline-none text-base md:text-lg text-slate-800"
                                            placeholder="Ex: Prateleira A1"
                                        >
                                    </div>

                                    <div class="md:col-span-2">
                                        <label class="text-sm font-bold text-slate-700 block mb-3 uppercase tracking-wide">Observações</label>

                                            id="itemObs"
                                            class="w-full bg-white shadow-sm border-2 border-slate-200 rounded-lg p-4 focus:border-amber-500 outline-none text-base md:text-lg text-slate-800"

                                            placeholder="Informações adicionais..."
                                        >${item.observacoes || ''}</textarea>
                                    </div>
                                </div>

                                <div class="flex gap-4 pt-6 border-t border-slate-200">
                                    <button 
                                        type="button"
                                        onclick="goBack()"
                                        class="flex-1 bg-slate-200 hover:bg-slate-300 text-slate-800 font-bold py-4 rounded-xl transition-all"
                                    >
                                        CANCELAR
                                    </button>
                                    <button 
                                        type="submit"
                                        class="flex-1 bg-amber-600 hover:bg-amber-700  font-bold py-4 rounded-xl transition-all flex items-center justify-center gap-2 text-white"
                                    >
                                        <i class="ph ph-floppy-disk text-xl"></i>
                                        ${isEdit ? 'ATUALIZAR' : 'CADASTRAR'}
                                    </button>
                                </div>
                            </form>
                        </div>
                    </main>
                </div>
            `;
        }

        function renderHeader() {
            const views = [
                { id: 'dashboard',   label: 'Dashboard',      icon: 'ph-fill ph-house' },
                { id: 'stock',       label: 'Estoque',         icon: 'ph-fill ph-warehouse' },
                { id: 'history',     label: 'Histórico',       icon: 'ph-fill ph-clock-counter-clockwise' },
                { id: 'analytics',   label: 'Analytics',       icon: 'ph-fill ph-chart-line' },
                { id: 'warehouses',  label: 'Almoxarifados',   icon: 'ph-fill ph-gear' },
            ];
            return `
                <div id="global-sync-bar"></div>
                <div id="topbar">
                    <div id="topbar-left">
                        <button class="topbar-icon-btn" onclick="openSidebar()" aria-label="Menu" title="Menu">
                            <i class="ph ph-list"></i>
                        </button>
                    </div>
                    <div class="logo">
                        <span class="logo-gps">Grupo GPS</span>
                        <div class="logo-divider"></div>
                        <span class="logo-gestao">Almoxarifado EPI</span>
                    </div>
                    <div id="topbar-right">
                        <button class="topbar-icon-btn" onclick="exportAll()" title="Exportar" aria-label="Exportar">
                            <i class="ph ph-download-simple"></i>
                        </button>
                        <button class="topbar-icon-btn" onclick="handleLogout()" title="Sair" aria-label="Sair" style="color:var(--red)">
                            <i class="ph ph-sign-out"></i>
                        </button>
                    </div>
                </div>

                <div id="nav-menu-overlay" class="nav-menu-overlay hidden" onclick="closeSidebar()">
                    <div class="nav-menu-panel" onclick="event.stopPropagation()">
                        <div class="nav-menu-header">
                            <div>
                                <div style="font-weight:800;font-size:16px;color:#0f3868;letter-spacing:-0.01em;">Grupo GPS</div>
                                <div style="font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:0.15em;color:var(--accent);">Mecanizada</div>
                                <div style="height:1px;background:var(--border);margin:6px 0;"></div>
                                <div style="font-size:11px;color:var(--text-3);font-weight:500;">Almoxarifado EPI</div>
                            </div>
                        </div>
                        <div class="nav-menu-body">
                            ${views.map(v => `
                                <button class="nav-menu-item ${state.view === v.id ? 'active' : ''}"
                                    onclick="closeSidebar(); navigateTo('${v.id}')">
                                    <i class="${v.icon}"></i>
                                    ${v.label}
                                </button>
                            `).join('')}
                            <button class="nav-menu-item" onclick="closeSidebar(); startMovement('COMPRA')">
                                <i class="ph-fill ph-shopping-cart"></i>
                                Nova Compra
                            </button>
                            <button class="nav-menu-item" onclick="closeSidebar(); startTransfer(state.activeWarehouse)">
                                <i class="ph-fill ph-arrows-left-right"></i>
                                Transferência
                            </button>
                        </div>
                        <div class="nav-menu-footer">
                            <div class="nav-menu-user-info">
                                <i class="ph-fill ph-user-circle" style="font-size:18px;color:var(--text-3);"></i>
                                <span>${state.user?.nome || state.user?.email || '—'}</span>
                            </div>
                            <button class="btn-ghost" onclick="closeSidebar(); handleLogout()" style="width:100%;justify-content:flex-start;gap:8px;">
                                <i class="ph ph-sign-out"></i> Sair
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        function openSidebar() {
            const overlay = document.getElementById('nav-menu-overlay');
            if (overlay) overlay.classList.remove('hidden');
        }

        function closeSidebar() {
            const overlay = document.getElementById('nav-menu-overlay');
            if (overlay) overlay.classList.add('hidden');
        }

        function exportAll() {
            if (state.view === 'history') {
                exportMovementsToXLSX();
            } else {
                exportStockToXLSX();
            }
        }

        // ============================================
        // INICIALIZAÇÃO
        // ============================================
        document.addEventListener('DOMContentLoaded', () => {
            // Tenta carregar sessão salva
            const savedUser = loadSession();

            if (savedUser) {
                state.user = savedUser;
                state.loadingMessage = 'Carregando...';
                state.isLoading = true;
                render();

                Promise.all([loadItems(), loadWarehouses()]).then(() => {
                    navigateTo('dashboard');
                    state.isLoading = false;
                    state.loadingMessage = '';
                    render();
                });
            } else {
                render();
            }
        });
    </script>
</body>

</html>
