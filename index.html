    <style>

        /* Skeleton Loading */

<body class="text-slate-800">
    <div id="app"></div>
    <div id="toast-container"></div>

    <script>
        // ============================================
        // CONFIGURAÇÃO SUPABASE
        // ============================================
        const SUPABASE_URL = 'https://mgcjidryrjqiceielmzp.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_1FBWf1mb1o5_J60VDlsfaA_IOsIFq6e';
        const sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // ============================================
        // CACHE E ESTADO
        // ============================================

        // Cache otimizado
        const cache = {
            movements: null,
            movementsTimestamp: null,
            movementsFilterKey: null,
            items: null,
            itemsTimestamp: null,
            statistics: null,
            statisticsTimestamp: null,
            warehouses: null,
            warehousesTimestamp: null,
            CACHE_DURATION: 300000 // 5 minutos
        };

        // ============================================
        // TIPOS DE MOVIMENTAÇÃO
        // ============================================
        const MOVEMENT_TYPES = {
            'COMPRA': { label: 'Compra de Estoque', color: 'emerald', icon: 'shopping-cart', sign: '+' },
            'REPOSICAO': { label: 'Reposição', color: 'blue', icon: 'arrow-clockwise', sign: '-' },
            'DISTRIBUICAO': { label: 'Distribuição EPI', color: 'purple', icon: 'hand-coins', sign: '-' },
            'SAIDA': { label: 'Saída', color: 'red', icon: 'arrow-up-right', sign: '-' },
            'AJUSTE': { label: 'Ajuste', color: 'amber', icon: 'wrench', sign: '±' },
            'TRANSFERENCIA': { label: 'Transferência', color: 'cyan', icon: 'arrows-left-right', sign: '→' }
        };

        // ============================================
        // ESTADO DA APLICAÇÃO
        // ============================================
        let state = {
            view: 'login',
            previousView: null,
            user: null,
            items: [],
            movements: [],
            selectedDate: getCurrentDate(),
            isLoading: false,
            loadingMessage: '',

            // Paginação
            currentPage: 1,
            itemsPerPage: 50,

            // Filtros avançados
            filters: {
                startDate: getFirstDayOfMonth(),
                endDate: getCurrentDate(),
                type: 'TODOS',
                searchTerm: '',
                category: 'TODAS',
                minQuantity: '',
                maxQuantity: '',
                location: '',
                lowStockOnly: false
            },

            // Operação de movimentação
            movementOperation: {
                active: false,
                type: null,
                selectedItem: null,
                employeeName: '',
                supplier: '',
                quantity: 1,
                observations: '',
                returnedOldEpi: null
            },

            // Edição de item
            editingItem: null,

            // Estatísticas e Analytics
            statistics: null,
            analytics: {
                weeklyExpenses: [],
                monthlyExpenses: [],
                topReplenishedItems: [],
                categoryDistribution: []
            },

            // Almoxarifados
            warehouses: [
                { id: 'alm-1', nome: 'Almoxarifado Central', descricao: 'Estoque principal de EPIs' },
                { id: 'alm-2', nome: 'Almoxarifado Distribuição', descricao: 'Itens prontos para distribuição' }
            ],
            activeWarehouse: 'alm-1',

            // Operação de transferência
            transferOperation: {
                active: false,
                fromWarehouse: 'alm-1',
                toWarehouse: 'alm-2',
                selectedItem: null,
                size: null,
                quantity: 1,
                observations: ''
            },

            // Edição de almoxarifado
            editingWarehouse: null
        };

        // Navigation history para o botão voltar
        let navigationHistory = [];

        // Debounce timer
        let searchDebounceTimer = null;

        // Pull to refresh
        let touchStartY = 0;
        let pullDistance = 0;
        const PULL_THRESHOLD = 80;

        // ============================================
        // UTILITÁRIOS
        // ============================================
        function getCurrentDate() {
            return new Date().toISOString().split('T')[0];
        }

        function getFirstDayOfMonth() {
            const now = new Date();
            return new Date(now.getFullYear(), now.getMonth(), 1).toISOString().split('T')[0];
        }

        function formatDate(dateStr) {
            if (!dateStr) return '';
            try {
                let date;
                if (dateStr instanceof Date) {
                    date = dateStr;
                } else if (typeof dateStr === 'string') {
                    if (dateStr.includes('-') && dateStr.length === 10) {
                        date = new Date(dateStr + 'T12:00:00');
                    } else {
                        date = new Date(dateStr);
                    }
                } else {
                    date = new Date(dateStr);
                }

                return date.toLocaleDateString('pt-BR', {
                    day: '2-digit',
                    month: '2-digit',
                    year: 'numeric'
                });
            } catch (e) {
                console.error('Erro ao formatar data:', dateStr, e);
                return dateStr;
            }
        }

        function formatDateTime(dateStr) {
            if (!dateStr) return '';
            try {
                const date = new Date(dateStr);
                return date.toLocaleString('pt-BR', {
                    day: '2-digit',
                    month: '2-digit',
                    year: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit'
                });
            } catch (e) {
                console.error('Erro ao formatar data/hora:', dateStr, e);
                return dateStr;
            }
        }

        function formatCurrency(value) {
            return new Intl.NumberFormat('pt-BR', {
                style: 'currency',
                currency: 'BRL'
            }).format(value);
        }

        function getColorClass(color, type = 'bg') {
            const colors = {
                emerald: type === 'bg' ? 'bg-emerald-500/20 border-emerald-500 text-emerald-400' : 'bg-emerald-600',
                red: type === 'bg' ? 'bg-red-500/20 border-red-500 text-red-400' : 'bg-red-600',
                blue: type === 'bg' ? 'bg-blue-500/20 border-blue-500 text-blue-400' : 'bg-blue-600',
                purple: type === 'bg' ? 'bg-purple-500/20 border-purple-500 text-purple-400' : 'bg-purple-600',
                amber: type === 'bg' ? 'bg-amber-500/20 border-amber-500 text-amber-400' : 'bg-amber-600',
                slate: type === 'bg' ? 'bg-slate-500/20 border-slate-500 text-slate-500' : 'bg-slate-600'
            };
            return colors[color] || colors.slate;
        }

        function debounce(func, wait) {
            return function executedFunction(...args) {
                clearTimeout(searchDebounceTimer);
                searchDebounceTimer = setTimeout(() => func(...args), wait);
            };
        }

        function isCacheValid(timestamp) {
            if (!timestamp) return false;
            return (Date.now() - timestamp) < cache.CACHE_DURATION;
        }

        // ============================================
        // TOAST NOTIFICATIONS
        // ============================================
        function showToast(message, type = 'info', duration = 3000) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast toast-${type}`;
            toast.innerHTML = `
                <div class="flex items-center gap-3">
                    <i class="ph-fill ph-${type === 'success' ? 'check-circle' : type === 'error' ? 'x-circle' : 'info'} text-2xl"></i>
                    <span class="font-semibold">${message}</span>
                </div>
            `;
            container.appendChild(toast);

            setTimeout(() => {
                toast.style.animation = 'slideInRight 0.3s ease-out reverse';
                setTimeout(() => container.removeChild(toast), 300);
            }, duration);
        }

        // ============================================
        // NAVEGAÇÃO E HISTÓRICO
        // ============================================
        function navigateTo(view) {
            if (state.view !== view) {
                navigationHistory.push(state.view);
                state.previousView = state.view;
                state.view = view;
                render();
            }
        }

        function goBack() {
            if (navigationHistory.length > 0) {
                const previousView = navigationHistory.pop();
                state.view = previousView;
                render();
                return true;
            }
            return false;
        }

        // Intercepta o botão voltar do navegador/dispositivo
        document.addEventListener('keydown', (e) => {
            // ESC para voltar
            if (e.key === 'Escape' && state.view !== 'login') {
                e.preventDefault();
                if (state.view === 'dashboard') {
                    if (confirm('Deseja sair do sistema?')) {
                        handleLogout();
                    }
                } else {
                    if (!goBack()) {
                        navigateTo('dashboard');
                    }
                }
            }
        });

        // Logout automático ao fechar a aba/navegador
        window.addEventListener('beforeunload', (e) => {
            // Salva estado antes de sair
            if (state.user) {
                // Mantém a sessão salva para próxima vez
                // Se quiser deslogar, descomente a linha abaixo:
                // clearSession();
            }
        });

        // Logout automático ao sair da página (navegar para outro site)
        window.addEventListener('pagehide', (e) => {
            // Desloga ao sair da página
            clearSession();
        });

        // ============================================
        // PERSISTÊNCIA DE LOGIN (7 DIAS)
        // ============================================
        function saveSession(user) {
            const session = {
                user: user,
                timestamp: Date.now(),
                expiresIn: 7 * 24 * 60 * 60 * 1000 // 7 dias
            };
            localStorage.setItem('epi_session', JSON.stringify(session));
        }

        function loadSession() {
            const sessionData = localStorage.getItem('epi_session');
            if (!sessionData) return null;

            try {
                const session = JSON.parse(sessionData);
                const now = Date.now();

                // Verifica se a sessão ainda é válida
                if (session.timestamp + session.expiresIn > now) {
                    return session.user;
                } else {
                    localStorage.removeItem('epi_session');
                    return null;
                }
            } catch (e) {
                localStorage.removeItem('epi_session');
                return null;
            }
        }

        function clearSession() {
            localStorage.removeItem('epi_session');
        }

        // ============================================
        // SERVIÇOS / API COM OPTIMISTIC UI
        // ============================================
        async function login(email, password) {
            try {
                const { data, error } = await sbClient.auth.signInWithPassword({
                    email: email,
                    password: password
                });

                if (error) throw error;

                // Busca o perfil para obter o nome
                const { data: profile, error: profileError } = await sbClient
                    .from('profiles')
                    .select('nome')
                    .eq('id', data.user.id)
                    .single();

                return {
                    success: true,
                    user: {
                        id: data.user.id,
                        nome: profile?.nome || data.user.email,
                        email: data.user.email
                    }
                };
            } catch (error) {
                console.error('Erro no login:', error);
                return { success: false, error: error.message };
            }
        }

        async function getItems(forceRefresh = false) {
            if (!forceRefresh && cache.items && isCacheValid(cache.itemsTimestamp)) {
                return { success: true, items: cache.items };
            }

            try {
                const { data, error } = await sbClient
                    .from('items')
                    .select('*')
                    .order('nome');

                if (error) throw error;

                cache.items = data;
                cache.itemsTimestamp = Date.now();

                return { success: true, items: data };
            } catch (error) {
                console.error('Erro ao buscar itens:', error);
                return { success: false, error: error.message };
            }
        }

        async function saveItem(item) {
            // Optimistic UI
            const isNew = !state.items.find(i => i.id === item.id);
            const originalItems = [...state.items];

            if (isNew) {
                state.items.push(item);
            } else {
                const index = state.items.findIndex(i => i.id === item.id);
                state.items[index] = item;
            }

            render();
            showToast(isNew ? 'Item cadastrado!' : 'Item atualizado!', 'success', 2000);

            try {
                const { error } = await sbClient
                    .from('items')
                    .upsert(item);

                if (error) throw error;

                cache.items = null;
                cache.itemsTimestamp = null;
                loadItems(true);
                return { success: true };
            } catch (error) {
                console.error('Erro ao salvar item:', error);
                state.items = originalItems;
                render();
                showToast('Erro ao salvar item: ' + error.message, 'error');
                return { success: false, error: error.message };
            }
        }

        async function deleteItem(itemId) {
            // Optimistic UI
            const itemBackup = state.items.find(i => i.id === itemId);
            state.items = state.items.filter(i => i.id !== itemId);
            render();
            showToast('Item excluído!', 'success', 2000);

            try {
                const { error } = await sbClient
                    .from('items')
                    .delete()
                    .eq('id', itemId);

                if (error) throw error;

                cache.items = null;
                cache.itemsTimestamp = null;
                return { success: true };
            } catch (error) {
                console.error('Erro ao deletar item:', error);
                state.items.push(itemBackup);
                render();
                showToast('Erro ao excluir item: ' + error.message, 'error');
                return { success: false, error: error.message };
            }
        }

        async function saveMovement(movement) {
            // Optimistic UI
            const item = state.items.find(i => i.id === movement.item_id);
            if (item) {
                const oldQuantity = item.quantidade;
                const oldTamanhos = item.tamanhos ? JSON.parse(JSON.stringify(item.tamanhos)) : null;

                // Atualiza quantidade baseado no tipo
                if (movement.size && item.tamanhos) {
                    if (movement.type === 'COMPRA') {
                        item.tamanhos[movement.size] = (item.tamanhos[movement.size] || 0) + movement.quantity;
                    } else {
                        item.tamanhos[movement.size] = (item.tamanhos[movement.size] || 0) - movement.quantity;
                    }
                    // Atualiza quantidade total
                    item.quantidade = Object.values(item.tamanhos).reduce((acc, curr) => acc + curr, 0);
                } else {
                    if (movement.type === 'COMPRA') {
                        item.quantidade += movement.quantity;
                    } else if (['DISTRIBUICAO', 'SAIDA', 'REPOSICAO'].includes(movement.type)) {
                        item.quantidade -= movement.quantity;
                    } else if (movement.type === 'AJUSTE') {
                        item.quantidade = movement.quantity;
                    }
                }

                render();
                showToast('Movimentação registrada!', 'success', 2000);

                try {
                    // 1. Registrar a movimentação
                    const { error: movError } = await sbClient
                        .from('movements')
                        .insert([movement]);

                    if (movError) throw movError;

                    // 2. Atualizar o estoque do item
                    const { error: itemError } = await sbClient
                        .from('items')
                        .update({ 
                            quantidade: item.quantidade,
                            tamanhos: item.tamanhos 
                        })
                        .eq('id', item.id);

                    if (itemError) throw itemError;

                    cache.movements = null;
                    cache.movementsTimestamp = null;
                    cache.items = null;
                    cache.itemsTimestamp = null;
                    cache.statistics = null;
                    cache.statisticsTimestamp = null;
                    
                    loadItems(true);
                    return { success: true };
                } catch (error) {
                    console.error('Erro ao salvar movimentação:', error);
                    // Reverte em caso de erro
                    item.quantidade = oldQuantity;
                    item.tamanhos = oldTamanhos;
                    render();
                    showToast('Erro ao registrar movimentação: ' + error.message, 'error');
                    return { success: false, error: error.message };
                }
            }
        }

        async function getMovements(filters, forceRefresh = false) {
            const filterKey = JSON.stringify(filters);
            if (!forceRefresh && cache.movements && cache.movementsFilterKey === filterKey && isCacheValid(cache.movementsTimestamp)) {
                return { success: true, movements: cache.movements };
            }

            try {
                let query = sbClient
                    .from('movements')
                    .select('*')
                    .order('date', { ascending: false });

                if (filters.startDate) query = query.gte('date', filters.startDate);
                if (filters.endDate) query = query.lte('date', filters.endDate);
                if (filters.type && filters.type !== 'TODOS') query = query.eq('type', filters.type);

                const { data, error } = await query;

                if (error) throw error;

                cache.movements = data;
                cache.movementsFilterKey = filterKey;
                cache.movementsTimestamp = Date.now();

                return { success: true, movements: data };
            } catch (error) {
                console.error('Erro ao buscar movimentações:', error);
                return { success: false, error: error.message };
            }
        }

        async function getStatistics() {
            if (cache.statistics && isCacheValid(cache.statisticsTimestamp)) {
                return { success: true, statistics: cache.statistics };
            }

            try {
                // Busca resumo rápido
                const { count: totalItems } = await sbClient
                    .from('items')
                    .select('*', { count: 'exact', head: true });

                const { data: stockData } = await sbClient
                    .from('items')
                    .select('quantidade');

                const totalStock = stockData.reduce((acc, curr) => acc + (curr.quantidade || 0), 0);

                const { count: lowStock } = await sbClient
                    .from('items')
                    .select('*', { count: 'exact', head: true })
                    .lt('quantidade', 10); // Exemplo de estoque baixo

                const statistics = {
                    totalItems,
                    totalStock,
                    lowStock,
                    lastUpdate: new Date().toISOString()
                };

                cache.statistics = statistics;
                cache.statisticsTimestamp = Date.now();

                return { success: true, statistics };
            } catch (error) {
                console.error('Erro ao buscar estatísticas:', error);
                return { success: false, error: error.message };

        async function transferItems() {
            const op = state.transferOperation;
            if (!op.selectedItem || op.quantity <= 0) {
                showToast('Preencha todos os campos', 'error');
                return;
            }

            const sourceItem = state.items.find(i => i.id === op.selectedItem);
            if (!sourceItem) {
                showToast('Item não encontrado', 'error');
                return;
            }

            // Verifica estoque
            if (op.size && sourceItem.tamanhos) {
                if ((sourceItem.tamanhos[op.size] || 0) < op.quantity) {
                    showToast(`Estoque insuficiente para tamanho ${op.size}`, 'error');
                    return;
                }
            } else if (!op.size && sourceItem.quantidade < op.quantity) {
                showToast('Quantidade insuficiente no estoque', 'error');
                return;
            }

            const fromWarehouse = state.warehouses.find(w => w.id === op.fromWarehouse);
            const toWarehouse = state.warehouses.find(w => w.id === op.toWarehouse);

            // Optimistic: atualiza origem
            const newSourceTamanhos = sourceItem.tamanhos ? JSON.parse(JSON.stringify(sourceItem.tamanhos)) : null;
            if (op.size && newSourceTamanhos) {
                newSourceTamanhos[op.size] = (newSourceTamanhos[op.size] || 0) - op.quantity;
                sourceItem.tamanhos = newSourceTamanhos;
                sourceItem.quantidade = Object.values(newSourceTamanhos).reduce((a, b) => a + b, 0);
            } else {
                sourceItem.quantidade -= op.quantity;
            }

            // Procura item equivalente no destino
            let destItem = state.items.find(i =>
                i.warehouse_id === op.toWarehouse &&
                i.nome === sourceItem.nome &&
                i.categoria === sourceItem.categoria
            );

            let newDestItem = null;
            if (destItem) {
                if (op.size && destItem.tamanhos) {
                    destItem.tamanhos[op.size] = (destItem.tamanhos[op.size] || 0) + op.quantity;
                    destItem.quantidade = Object.values(destItem.tamanhos).reduce((a, b) => a + b, 0);
                } else {
                    destItem.quantidade += op.quantity;
                }
            } else {
                newDestItem = {
                    ...sourceItem,
                    id: 'ITEM-TRF-' + Date.now(),
                    warehouse_id: op.toWarehouse,
                    quantidade: op.quantity,
                    tamanhos: op.size && sourceItem.tamanhos
                        ? Object.fromEntries(Object.keys(sourceItem.tamanhos).map(s => [s, s === op.size ? op.quantity : 0]))
                        : null
                };
                state.items.push(newDestItem);
            }

            render();
            showToast(`Transferindo para ${toWarehouse?.nome || 'destino'}...`, 'info', 2000);

            try {
                // 1. Registra movimentação (com fallback se coluna não existir no banco)
                const movementPayload = {
                    date: getCurrentDate(),
                    type: 'TRANSFERENCIA',
                    item_id: sourceItem.id,
                    item_name: op.size ? `${sourceItem.nome} (Tam: ${op.size})` : sourceItem.nome,
                    size: op.size,
                    quantity: op.quantity,
                    user_name: state.user.nome,
                    observations: op.observations || `Transferido de ${fromWarehouse?.nome} para ${toWarehouse?.nome}`,
                    destination_warehouse_id: op.toWarehouse
                };

                let movResult = await sbClient.from('movements').insert([movementPayload]);
                if (movResult.error) {
                    // Pode ser que a coluna destination_warehouse_id não exista,
                    // ou que exista uma constraint no banco rejeitando o type 'TRANSFERENCIA'.
                    console.warn('Retentando sem destination_warehouse_id ou ajustando type:', movResult.error.message);
                    const { destination_warehouse_id, ...movFallback } = movementPayload;
                    
                    // Fallback para tipo existente caso a constraint do banco rejeite TRANSFERENCIA
                    movFallback.type = 'SAIDA';
                    movFallback.observations = '[TRANSFERÊNCIA] ' + (movFallback.observations || '');
                    
                    movResult = await sbClient.from('movements').insert([movFallback]);
                    if (movResult.error) throw movResult.error;
                }

                // 2. Atualiza item de origem
                const { error: srcErr } = await sbClient.from('items')
                    .update({ quantidade: sourceItem.quantidade, tamanhos: sourceItem.tamanhos })
                    .eq('id', sourceItem.id);
                if (srcErr) throw srcErr;

                // 3. Cria ou atualiza item no destino
                if (destItem) {
                    const { error: dstErr } = await sbClient.from('items')
                        .update({ quantidade: destItem.quantidade, tamanhos: destItem.tamanhos })
                        .eq('id', destItem.id);
                    if (dstErr) throw dstErr;
                } else if (newDestItem) {
                    let insResult = await sbClient.from('items').insert([newDestItem]);
                    if (insResult.error) {
                        // warehouse_id ou id duplicado pode causar erro
                        console.warn('Retentando insert de destino sem warehouse_id:', insResult.error.message);
                        const { warehouse_id, id: _id, ...itemFallback } = newDestItem;
                        insResult = await sbClient.from('items').insert([itemFallback]);
                        if (insResult.error) throw insResult.error;
                    }
                }

                cache.items = null;
                cache.itemsTimestamp = null;
                cache.movements = null;
                cache.movementsTimestamp = null;
                await loadItems(true);

                showToast('Transferência concluída!', 'success');

                state.transferOperation = {
                    active: false, fromWarehouse: 'alm-1', toWarehouse: 'alm-2',
                    selectedItem: null, size: null, quantity: 1, observations: ''
                };
                goBack();

            } catch (error) {
                console.error('Erro na transferência:', error);
                showToast('Erro na transferência: ' + error.message, 'error');
                await loadItems(true);
            }
        }

        function calculateAnalytics() {
            // Calcula analytics baseado nas movimentações
            const now = new Date();
            const weekAgo = new Date(now.getTime() - 7 * 24 * 60 * 60 * 1000);
            const monthAgo = new Date(now.getTime() - 30 * 24 * 60 * 60 * 1000);

            // Movimentações recentes
            const recentMovements = state.movements.filter(m => {
                const movDate = new Date(m.date);
                return movDate >= monthAgo;
            });

            // Itens mais repostos
            const replenishmentCount = {};
            recentMovements.forEach(m => {
                if (m.type === 'REPOSICAO' || m.type === 'COMPRA') {
                    replenishmentCount[m.item_name] = (replenishmentCount[m.item_name] || 0) + m.quantity;
                }
            });

            state.analytics.topReplenishedItems = Object.entries(replenishmentCount)
                .sort((a, b) => b[1] - a[1])
                .slice(0, 5)
                .map(([name, count]) => ({ name, count }));

            // Distribuição por categoria
            const categoryDist = {};
            state.items.forEach(item => {
                categoryDist[item.categoria] = (categoryDist[item.categoria] || 0) + item.quantidade;
            });

            state.analytics.categoryDistribution = Object.entries(categoryDist)
                .map(([category, quantity]) => ({ category, quantity }));

            // Contagem de movimentações
            const movementsByType = {};
            if (state.movements) {
                state.movements.forEach(m => {
                    movementsByType[m.type] = (movementsByType[m.type] || 0) + 1;
                });
                state.statistics.totalMovements = state.movements.length;
            } else {
                state.statistics.totalMovements = 0;
            }
            state.statistics.movementsByType = movementsByType;
        }

        function exportStockToXLSX() {
            try {
                const items = state.items;
                if (!items || items.length === 0) {
                    showToast('Não há dados para exportar', 'error');
                    return;
                }

                const data = items.map(item => {
                    // Descobre o nome do almoxarifado
                    const wh = state.warehouses.find(w => w.id === (item.warehouse_id || 'alm-1'));
                    const row = {
                        'Almoxarifado': wh?.nome || 'Almoxarifado Central',
                        'Nome': item.nome,
                        'Categoria': item.categoria,
                        'Quantidade Total': item.quantidade,
                        'Unidade': item.unidade,
                        'CA': item.ca || '-',
                        'Validade': item.validade ? formatDate(item.validade) : '-',
                        'Localização': item.localizacao || '-',
                        'Observações': item.observacoes || ''
                    };

                    if (item.tamanhos) {
                        Object.entries(item.tamanhos).forEach(([size, qty]) => {
                            row[`Tam: ${size}`] = qty;
                        });
                    }

                    return row;
                });

                const worksheet = XLSX.utils.json_to_sheet(data);
                const workbook = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(workbook, worksheet, "Estoque");

                XLSX.writeFile(workbook, `Estoque_Almoxarifado_${getCurrentDate()}.xlsx`);
                showToast('Relatório de estoque gerado!', 'success');
            } catch (error) {
                console.error('Erro ao exportar estoque:', error);

        async function confirmMovement() {
            const op = state.movementOperation;

            if (!op.selectedItem || op.quantity <= 0) {
                showToast('Preencha todos os campos obrigatórios', 'error');
                return;
            }

            if (op.type === 'DISTRIBUICAO' && !op.employeeName) {
                showToast('Nome do colaborador é obrigatório', 'error');
                return;
            }

            if (op.type === 'DISTRIBUICAO' && op.returnedOldEpi === null) {
                showToast('Informe se o EPI antigo foi devolvido', 'error');
                return;
            }

            if (op.type === 'COMPRA' && !op.supplier) {
                showToast('Nome do fornecedor é obrigatório', 'error');
                return;
            }

            const item = state.items.find(i => i.id === op.selectedItem);
            if (!item) {
                showToast('Item não encontrado', 'error');
                return;
            }

            if (item.tamanhos && Object.keys(item.tamanhos).length > 0 && !op.size) {
                showToast('Selecione um tamanho', 'error');
                return;
            }

            if (['DISTRIBUICAO', 'SAIDA', 'REPOSICAO'].includes(op.type)) {
                if (op.size && item.tamanhos[op.size] < op.quantity) {
                    showToast(`Estoque insuficiente para o tamanho ${op.size}`, 'error');
                    return;
                } else if (!op.size && item.quantidade < op.quantity) {
                    showToast('Quantidade em estoque insuficiente', 'error');
                    return;
                }
            }

            let finalObservations = op.observations;
            if (op.type === 'DISTRIBUICAO') {
                const epiStatus = op.returnedOldEpi ? '[EPI Antigo: Devolvido]' : '[EPI Antigo: Não Devolvido/Novo]';
                finalObservations = finalObservations ? `${epiStatus}\n${finalObservations}` : epiStatus;
            }

            const movement = {
                date: getCurrentDate(),
                type: op.type,
                item_id: item.id,
                item_name: op.size ? `${item.nome} (Tam: ${op.size})` : item.nome,
                size: op.size,
                quantity: op.quantity,
                employee: op.employeeName || '',
                supplier: op.supplier || '',
                user_name: state.user.nome,
                observations: finalObservations
            };

            const result = await saveMovement(movement);

            if (result.success) {
                cancelMovement();
            }
        }

                    m.employee?.toLowerCase().includes(term) ||

        function getFilteredItems() {
            let filtered = state.items;

            // Filtro por almoxarifado
            filtered = filtered.filter(i => {
                const wid = i.warehouse_id || 'alm-1';
                return wid === state.activeWarehouse;
            });

            // Filtro por categoria
            if (state.filters.category !== 'TODAS') {
                filtered = filtered.filter(i => i.categoria === state.filters.category);
            }

            // Filtro por localização
            if (state.filters.location) {
                const loc = state.filters.location.toLowerCase();
                filtered = filtered.filter(i => i.localizacao?.toLowerCase().includes(loc));
            }

            // Filtro por quantidade mínima
            if (state.filters.minQuantity !== '') {
                filtered = filtered.filter(i => i.quantidade >= parseInt(state.filters.minQuantity));
            }

            // Filtro por quantidade máxima
            if (state.filters.maxQuantity !== '') {
                filtered = filtered.filter(i => i.quantidade <= parseInt(state.filters.maxQuantity));
            }

            // Filtro por estoque baixo
            if (state.filters.lowStockOnly) {
                filtered = filtered.filter(i => i.quantidade < 10);
            }

            // Filtro por busca de texto
            if (state.filters.searchTerm) {
                const term = state.filters.searchTerm.toLowerCase();
                filtered = filtered.filter(i =>
                    i.nome?.toLowerCase().includes(term) ||
                    i.categoria?.toLowerCase().includes(term) ||
                    i.localizacao?.toLowerCase().includes(term) ||
                    i.ca?.toLowerCase().includes(term)
                );
            }

            return filtered;
        }

        function renderMovement() {
            const op = state.movementOperation;
            const typeInfo = MOVEMENT_TYPES[op.type];
            const availableItems = ['DISTRIBUICAO', 'REPOSICAO'].includes(op.type) ? state.items.filter(item => item.quantidade > 0) : state.items;
            const selectedItem = availableItems.find(item => item.id === op.selectedItem);

            return `
                <div class="min-h-screen pb-6">
                    ${renderHeader()}
                    
                    <main class="p-4 max-w-3xl mx-auto">
                        <div class="glass p-6 md:p-8 rounded-xl">
                            <div class="flex items-center justify-between mb-6">
                                <h1 class="text-2xl md:text-3xl font-bold flex items-center gap-3">
                                    <i class="ph-fill ph-${typeInfo.icon} text-${typeInfo.color}-400"></i>
                                    <span class="hidden md:inline">${typeInfo.label}</span>
                                    <span class="md:hidden">${typeInfo.label.split(' ')[0]}</span>
                                </h1>
                                <button onclick="cancelMovement()" class="text-slate-500 hover:text-red-500 transition-all">
                                    <i class="ph ph-x text-3xl"></i>
                                </button>
                            </div>

                            ${availableItems.length === 0 ? `
                                <div class="text-center py-12 text-slate-500">
                                    <i class="ph ph-warning-circle text-6xl md:text-8xl mb-4 text-amber-500"></i>
                                    <p class="text-lg md:text-xl mb-4">Nenhum item disponível</p>
                                    <button onclick="cancelMovement()" class="bg-slate-200 hover:bg-slate-300 px-6 py-3 rounded-lg font-bold">
                                        Voltar
                                    </button>

                                <form onsubmit="event.preventDefault(); confirmMovement();" class="space-y-6">
                                    <div>
                                        <label class="text-sm font-bold text-slate-700 block mb-3 uppercase tracking-wide">Selecione o Item *</label>
                                        <select 
                                            onchange="state.movementOperation.selectedItem = this.value; render()"
                                            class="w-full bg-slate-800/50 border-2 border-slate-700 rounded-lg p-4 focus:border-${typeInfo.color}-500 outline-none text-base md:text-lg text-white"
                                            required
                                        >
                                            <option value="">-- Escolha um item --</option>
                                            ${availableItems.map(item => `
                                                <option value="${item.id}" ${op.selectedItem === item.id ? 'selected' : ''}>
                                                    ${item.nome} (${item.quantidade})
                                                </option>
                                            `).join('')}
                                        </select>
                                    </div>

                                    ${selectedItem ? `
                                        <div class="glass p-4 rounded-lg border-2 border-${typeInfo.color}-500/50">
                                            <div class="flex justify-between items-center">
                                                <div>
                                                    <p class="text-slate-500 text-sm">Selecionado</p>
                                                    <p class="font-bold text-base md:text-lg">${selectedItem.nome}</p>
                                                </div>
                                                <div class="text-right">
                                                    <p class="text-slate-400 text-sm">Estoque</p>
                                                    <p class="font-bold text-xl md:text-2xl font-mono text-${typeInfo.color}-400">${selectedItem.quantidade}</p>
                                                </div>
                                            </div>
                                        </div>
                                    ` : ''}

                                    ${selectedItem && selectedItem.tamanhos && Object.keys(selectedItem.tamanhos).length > 0 ? `
                                        <div>
                                            <label class="text-sm font-bold text-slate-700 block mb-3 uppercase tracking-wide">Tamanho *</label>
                                            <select 
                                                onchange="state.movementOperation.size = this.value; render()"
                                                class="w-full bg-white shadow-sm border-2 border-slate-200 rounded-lg p-4 focus:border-${typeInfo.color}-500 outline-none text-base md:text-lg text-slate-800"
                                                required
                                            >
                                                <option value="">-- Selecione o tamanho --</option>
                                                ${Object.entries(selectedItem.tamanhos).map(([size, qty]) => `
                                                    <option value="${size}" ${op.size === size ? 'selected' : ''}>
                                                        ${size} (Estoque: ${qty})
                                                    </option>
                                                `).join('')}
                                            </select>
                                        </div>
                                    ` : ''}

                                    ${op.type === 'DISTRIBUICAO' ? `
                                        <div>
                                            <label class="text-sm font-bold text-slate-700 block mb-3 uppercase tracking-wide">Colaborador *</label>
                                            <input 
                                                type="text"
                                                value="${op.employeeName}"
                                                onchange="state.movementOperation.employeeName = this.value"
                                                class="w-full bg-white shadow-sm border-2 border-slate-200 rounded-lg p-4 focus:border-${typeInfo.color}-500 outline-none text-base md:text-lg text-slate-800"
                                                placeholder="Nome completo"
                                                required
                                            >
                                        </div>
                                        <div>
                                            <label class="text-sm font-bold text-slate-700 block mb-3 uppercase tracking-wide">Devolveu EPI Antigo? *</label>
                                            <select 
                                                onchange="state.movementOperation.returnedOldEpi = this.value === 'true'"
                                                class="w-full bg-white shadow-sm border-2 border-slate-200 rounded-lg p-4 focus:border-${typeInfo.color}-500 outline-none text-base md:text-lg text-slate-800"
                                                required
                                            >
                                                <option value="" disabled ${op.returnedOldEpi === null ? 'selected' : ''}>-- Selecione --</option>
                                                <option value="true" ${op.returnedOldEpi === true ? 'selected' : ''}>Sim, devolveu</option>
                                                <option value="false" ${op.returnedOldEpi === false ? 'selected' : ''}>Não devolveu / Primeira vez</option>
                                            </select>
                                        </div>
                                    ` : ''}

                                    ${op.type === 'COMPRA' ? `
                                        <div>
                                            <label class="text-sm font-bold text-slate-700 block mb-3 uppercase tracking-wide">Fornecedor *</label>
                                            <input 
                                                type="text"
                                                value="${op.supplier}"
                                                onchange="state.movementOperation.supplier = this.value"
                                                class="w-full bg-white shadow-sm border-2 border-slate-200 rounded-lg p-4 focus:border-${typeInfo.color}-500 outline-none text-base md:text-lg text-slate-800"
                                                placeholder="Nome do fornecedor"
                                                required
                                            >
                                        </div>
                                    ` : ''}

                                    <div>
                                        <label class="text-sm font-bold text-slate-700 block mb-3 uppercase tracking-wide">Quantidade *</label>
                                        <input 
                                            type="number"
                                            value="${op.quantity}"
                                            onchange="state.movementOperation.quantity = parseInt(this.value)"
                                            min="1"
                                            ${selectedItem && (op.type === 'DISTRIBUICAO' || op.type === 'REPOSICAO') ? `max="${selectedItem.quantidade}"` : ''}
                                            class="w-full bg-white shadow-sm border-2 border-slate-200 rounded-lg p-4 focus:border-${typeInfo.color}-500 outline-none text-base md:text-lg text-slate-800 font-mono"
                                            required
                                        >
                                    </div>

                                    <div>
                                        <label class="text-sm font-bold text-slate-700 block mb-3 uppercase tracking-wide">Observações</label>
                                        <textarea 
                                            onchange="state.movementOperation.observations = this.value"
                                            class="w-full bg-white shadow-sm border-2 border-slate-200 rounded-lg p-4 focus:border-${typeInfo.color}-500 outline-none text-base md:text-lg text-slate-800"
                                            rows="3"
                                            placeholder="Informações adicionais (opcional)"
                                        >${op.observations}</textarea>
                                    </div>

                                    <div class="flex gap-4 pt-6">
                                        <button 
                                            type="button"
                                            onclick="cancelMovement()"
                                            class="flex-1 bg-slate-200 hover:bg-slate-300 text-slate-800 font-bold py-4 rounded-xl transition-all"
                                        >
                                            CANCELAR
                                        </button>
                                        <button 
                                            type="submit"
                                            class="flex-1 bg-${typeInfo.color}-600 hover:bg-${typeInfo.color}-700 text-slate-800 font-bold py-4 rounded-xl transition-all flex items-center justify-center gap-2"
                                        >
                                            <i class="ph ph-check-circle text-xl"></i>
                                            <span class="hidden md:inline">CONFIRMAR</span>
                                            <span class="md:hidden">OK</span>
                                        </button>
                                    </div>
                                </form>
                            `}
                        </div>
                    </main>
                </div>
            `;
        }

        function renderStock() {

                            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                                <div>
                                    <label class="text-xs font-bold text-slate-500 block mb-2 uppercase">Categoria</label>

                                    >
                                        <option value="TODAS">Todas</option>
                                        ${categories.map(cat => `
                                            <option value="${cat}" ${state.filters.category === cat ? 'selected' : ''}>${cat}</option>
                                        `).join('')}

                                </div>
                                <div>
                                    <label class="text-xs font-bold text-slate-500 block mb-2 uppercase">Localização</label>

                                            <div class="flex-1 pr-2">
                                                <h3 class="font-bold text-lg md:text-xl mb-2 break-words">${item.nome}</h3>
                                                <div class="flex gap-2 flex-wrap">

                                                    <span class="text-xs px-2 md:px-3 py-1 bg-slate-500/20 text-slate-500 rounded-full font-mono">${item.unidade}</span>

                                            ${item.tamanhos && Object.keys(item.tamanhos).length > 0 ? `
                                                <div class="mt-3 flex flex-wrap gap-2">

                                            ${item.quantidade < 10 ? `
                                                <div class="mt-3 bg-amber-50 border border-amber-200 text-amber-600 px-3 py-2 rounded-lg text-xs font-semibold flex items-center gap-2">

                                                    ESTOQUE BAIXO

                                        </div>

                                        ${item.localizacao ? `

                                            </button>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        `}
                    </main>
                </div>
            `;
        }

        function renderTransfer() {

            const sourceItems = state.items.filter(i => (i.warehouse_id || 'alm-1') === op.fromWarehouse && i.quantidade > 0);
            const selectedItem = sourceItems.find(i => i.id === op.selectedItem);

            return `

                            ${sourceItems.length === 0 ? `

                                    <div>
                                        <label class="text-sm font-bold text-slate-700 block mb-3 uppercase tracking-wide">Item a Transferir *</label>
                                        <select
                                            onchange="state.transferOperation.selectedItem = this.value; state.transferOperation.size = null; render()"
                                            class="w-full bg-white shadow-sm border-2 border-slate-200 rounded-lg p-4 focus:border-cyan-500 outline-none text-slate-800"
                                            required
                                        >
                                            <option value="">-- Selecione um item --</option>
                                            ${sourceItems.map(item => `
                                                <option value="${item.id}" ${op.selectedItem === item.id ? 'selected' : ''}>
                                                    ${item.nome} (${item.quantidade} em estoque)
                                                </option>
                                            `).join('')}

                                    </div>

                                    ${selectedItem ? `

                                            <div class="flex justify-between items-center">
                                                <div>
                                                    <p class="text-slate-500 text-sm">Item selecionado</p>
                                                    <p class="font-bold text-lg">${selectedItem.nome}</p>
                                                    <span class="text-xs px-2 py-1 bg-blue-500/20 text-blue-500 rounded-full">${selectedItem.categoria}</span>

                                                <div class="text-right">
                                                    <p class="text-slate-400 text-sm">Disponível</p>
                                                    <p class="font-bold text-2xl font-mono text-emerald-500">${selectedItem.quantidade}</p>
                                                </div>
                                            </div>
                                        </div>
                                    ` : ''}

                                    ${selectedItem && selectedItem.tamanhos && Object.keys(selectedItem.tamanhos).length > 0 ? `
                                        <div>
                                            <label class="text-sm font-bold text-slate-700 block mb-3 uppercase tracking-wide">Tamanho *</label>
                                            <select
                                                onchange="state.transferOperation.size = this.value; render()"

                                        <button type="submit" class="flex-1 bg-cyan-600 hover:bg-cyan-700 text-white font-bold py-4 rounded-xl transition-all flex items-center justify-center gap-2">
                                            <i class="ph-fill ph-arrows-left-right"></i>
                                            TRANSFERIR

                                </div>

                                    </div>

                                    <!-- Área de Configuração de Tamanhos -->
                                    <div id="sizesConfigArea" class="md:col-span-2 ${item.tamanhos && Object.keys(item.tamanhos).length > 0 ? 'block' : 'hidden'} fade-in">
                                        <div class="bg-amber-50/50 border-2 border-amber-100 rounded-xl p-4 md:p-6">
                                            <div class="flex justify-between items-center mb-4">
                                                <h3 class="font-bold text-amber-800 flex items-center gap-2">
                                                    <i class="ph-fill ph-list-numbers"></i>
                                                    Grade de Tamanhos e Quantidades
                                                </h3>
                                                <button type="button" onclick="addSizeRow()" class="bg-amber-600 hover:bg-amber-700 text-white px-4 py-2 rounded-lg text-sm font-bold flex items-center gap-2 transition-all">
                                                    <i class="ph ph-plus"></i> Add Tamanho
                                                </button>
                                            </div>
                                            
                                            <div id="sizesList" class="space-y-2">
                                                ${item.tamanhos ? Object.entries(item.tamanhos).map(([name, qty]) => `
                                                    <div class="flex gap-3 items-center size-row mb-2">
                                                        <input type="text" class="size-name w-1/2 bg-white border border-slate-300 rounded p-2 focus:border-amber-500 outline-none" placeholder="Ex: 40 ou M" value="${name}" required>
                                                        <input type="number" class="size-qty w-1/3 bg-white border border-slate-300 rounded p-2 font-mono focus:border-amber-500 outline-none" placeholder="Qtd" value="${qty}" required min="0">
                                                        <button type="button" onclick="this.parentElement.remove()" class="text-red-500 hover:text-red-700 p-2"><i class="ph-bold ph-trash"></i></button>
                                                    </div>
                                                `).join('') : ''}
                                            </div>
                                            <p class="text-xs text-amber-600 mt-4 italic">
                                                * A quantidade total será a soma de todos os tamanhos.
                                            </p>
                                        </div>
                                    </div>

                                    <div id="singleQuantityArea" class="md:col-span-1 ${item.tamanhos && Object.keys(item.tamanhos).length > 0 ? 'hidden' : 'block'}">
                                        <label class="text-sm font-bold text-slate-700 block mb-3 uppercase tracking-wide">Quantidade em Estoque *</label>
                                        <input 
                                            type="number"
                                            id="itemQuantity"
                                            value="${item.quantidade || 0}"
                                            min="0"
                                            class="w-full bg-white shadow-sm border-2 border-slate-200 rounded-lg p-4 focus:border-amber-500 outline-none text-base md:text-lg text-slate-800 font-mono"
                                            ${item.tamanhos && Object.keys(item.tamanhos).length > 0 ? '' : 'required'}
                                        >
                                    </div>

                                    <div>
                                        <label class="text-sm font-bold text-slate-700 block mb-3 uppercase tracking-wide">CA</label>
                                        <input 
                                            type="text"
                                            id="itemCA"
                                            value="${item.ca || ''}"
                                            class="w-full bg-white shadow-sm border-2 border-slate-200 rounded-lg p-4 focus:border-amber-500 outline-none text-base md:text-lg text-slate-800 font-mono"
                                            placeholder="Ex: 12345"
                                        >
                                    </div>

                                    <div>
                                        <label class="text-sm font-bold text-slate-700 block mb-3 uppercase tracking-wide">Validade</label>
                                        <input 
                                            type="date"
                                            id="itemValidity"
                                            value="${item.validade || ''}"
                                            class="w-full bg-white shadow-sm border-2 border-slate-200 rounded-lg p-4 focus:border-amber-500 outline-none text-base md:text-lg text-slate-800"
                                        >
                                    </div>

                                    <div>
                                        <label class="text-sm font-bold text-slate-700 block mb-3 uppercase tracking-wide">Localização</label>
                                        <input 
                                            type="text"
                                            id="itemLocation"
                                            value="${item.localizacao || ''}"
                                            class="w-full bg-white shadow-sm border-2 border-slate-200 rounded-lg p-4 focus:border-amber-500 outline-none text-base md:text-lg text-slate-800"
                                            placeholder="Ex: Prateleira A1"
                                        >
                                    </div>

                                    <div class="md:col-span-2">
                                        <label class="text-sm font-bold text-slate-700 block mb-3 uppercase tracking-wide">Observações</label>
                                        <textarea 
                                            id="itemObs"
                                            class="w-full bg-white shadow-sm border-2 border-slate-200 rounded-lg p-4 focus:border-amber-500 outline-none text-base md:text-lg text-slate-800"
                                            rows="3"
                                            placeholder="Informações adicionais..."
                                        >${item.observacoes || ''}</textarea>
                                    </div>
                                </div>

                                <div class="flex gap-4 pt-6 border-t border-slate-200">
                                    <button 
                                        type="button"
                                        onclick="goBack()"
                                        class="flex-1 bg-slate-200 hover:bg-slate-300 text-slate-800 font-bold py-4 rounded-xl transition-all"
                                    >
                                        CANCELAR
                                    </button>
                                    <button 
                                        type="submit"
                                        class="flex-1 bg-amber-600 hover:bg-amber-700  font-bold py-4 rounded-xl transition-all flex items-center justify-center gap-2 text-white"
                                    >
                                        <i class="ph ph-floppy-disk text-xl"></i>
                                        ${isEdit ? 'ATUALIZAR' : 'CADASTRAR'}
                                    </button>
                                </div>
                            </form>
                        </div>
                    </main>
                </div>
            `;
        }

        function renderHeader() {
            return `
                <header class="bg-white border-b border-slate-200 p-3 md:p-4 sticky top-0 z-30 shadow-sm">
                    <div class="max-w-7xl mx-auto flex justify-between items-center">
                        <div class="flex items-center gap-3 md:gap-4">
                            <div class="w-10 h-10 md:w-12 md:h-12 bg-emerald-500/10 rounded-lg flex items-center justify-center">
                                <i class="ph-fill ph-package text-emerald-600 text-xl md:text-2xl"></i>
                            </div>
                            <div>
                                <h1 class="font-bold text-base md:text-xl font-mono text-slate-800">ALMOXARIFADO</h1>
                                <p class="text-xs md:text-sm text-slate-500 truncate max-w-[120px] md:max-w-none">${state.user?.nome || 'Sistema'}</p>
                            </div>
                        </div>
                        
                        <nav class="flex gap-1 md:gap-2">
                            <button 
                                onclick="navigateTo('dashboard')"
                                class="px-3 md:px-4 py-2 rounded-lg hover:bg-slate-100 transition-all ${state.view === 'dashboard' ? 'bg-slate-100 text-emerald-600' : 'text-slate-600'}"
                                title="Dashboard"
                            >
                                <i class="ph-fill ph-house text-lg md:text-xl"></i>
                            </button>
                            <button 
                                onclick="navigateTo('stock')"
                                class="px-3 md:px-4 py-2 rounded-lg hover:bg-slate-100 transition-all ${state.view === 'stock' ? 'bg-slate-100 text-emerald-600' : 'text-slate-600'}"
                                title="Estoque"
                            >
                                <i class="ph-fill ph-warehouse text-lg md:text-xl"></i>
                            </button>
                            <button 
                                onclick="navigateToHistory()"
                                class="px-3 md:px-4 py-2 rounded-lg hover:bg-slate-100 transition-all ${state.view === 'history' ? 'bg-slate-100 text-emerald-600' : 'text-slate-600'}"
                                title="Histórico"
                            >
                                <i class="ph-fill ph-clock-counter-clockwise text-lg md:text-xl"></i>
                            </button>
                            <button 
                                onclick="startTransfer(state.activeWarehouse)"
                                class="px-3 md:px-4 py-2 rounded-lg hover:bg-slate-100 transition-all ${state.view === 'transfer' ? 'bg-slate-100 text-cyan-600' : 'text-slate-600'}"
                                title="Transferência"
                            >
                                <i class="ph-fill ph-arrows-left-right text-lg md:text-xl"></i>
                            </button>
                            <button 
                                onclick="navigateToWarehouses()"
                                class="px-3 md:px-4 py-2 rounded-lg hover:bg-slate-100 transition-all ${state.view === 'warehouses' ? 'bg-slate-100 text-slate-700' : 'text-slate-600'}"
                                title="Almoxarifados"
                            >
                                <i class="ph-fill ph-gear text-lg md:text-xl"></i>
                            </button>
                            <button 
                                onclick="handleLogout()"
                                class="px-3 md:px-4 py-2 rounded-lg hover:bg-red-50 transition-all text-red-500 hover:text-red-600"
                                title="Sair"
                            >
                                <i class="ph-fill ph-sign-out text-lg md:text-xl"></i>
                            </button>
                        </nav>
                    </div>
                </header>
            `;
        }

        // ============================================
        // INICIALIZAÇÃO
        // ============================================
        document.addEventListener('DOMContentLoaded', () => {
            // Tenta carregar sessão salva
            const savedUser = loadSession();

            if (savedUser) {
                state.user = savedUser;
                state.loadingMessage = 'Carregando...';
                state.isLoading = true;
                render();

                Promise.all([loadItems(), loadWarehouses()]).then(() => {
                    navigateTo('dashboard');
                    state.isLoading = false;
                    state.loadingMessage = '';
                    render();
                });
            } else {
                render();
            }
        });
    </script>
</body>

</html>
